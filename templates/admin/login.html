{% extends "base.html" %}

{% block title %}Đăng nhập quản trị | Allergy Warning{% endblock %}

{% block content %}
<section class="content-shell page-section admin-login-wrap">
  <div class="admin-login-card">
    <span class="eyebrow">KHU VỰC QUẢN TRỊ</span>
    <h1>Đăng nhập admin</h1>
    <p class="muted-copy">Sử dụng tài khoản quản trị đã được cấp quyền.</p>
    <form method="post" action="{{ url_for('admin.login') }}" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ admin_csrf_token }}">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required value="{{ request.form.get('email', '') }}">
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary full-width" type="submit">Đăng nhập</button>
    </form>
    <a class="admin-back-link" href="{{ url_for('main.index') }}">← Quay lại trang chính</a>
  </div>
</section>
{% endblock %}
